<ion-fab horizontal="end" vertical="bottom" slot="fixed"  [style.padding-right]="'16px'" [style.margin-bottom]="'130px'" (click)="toggleTheme()">
  <ion-fab-button>
    <ion-icon
      [name]="isLightMode ? 'sunny' : 'moon'"
      class="text-2xl hover:cursor-pointer">
    </ion-icon>
  </ion-fab-button>
</ion-fab>
