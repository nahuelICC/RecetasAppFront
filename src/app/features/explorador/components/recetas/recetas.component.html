<div
  class="relative w-full aspect-[4/3] rounded-lg shadow flex flex-col overflow-hidden
         bg-cover bg-center bg-gray-400  cursor-pointer group
         transition-transform duration-200 ease-in-out hover:scale-105"
  [routerLink]="null"
  [style.background-image]="'url(' + (recipeData?.imagen || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4E9PAFl4BSriEZrYxy5wZyhNVVZUcIseHVQ&s') + ')'"  role="link"
  tabindex="0"
  [attr.aria-label]="'Ver receta ' + recipeData?.nombre">

  <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>

  <div class="relative z-10 flex flex-col h-full p-3 text-white"> <div class="flex flex-row items-center space-x-2 flex-shrink-0">
    <img
      class="w-8 h-8 rounded-full object-cover flex-shrink-0 border border-white/50"
      [src]="recipeData?.imagenUsuario || 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_640.png'"
      [alt]="'Avatar de ' + (recipeData?.usuario || 'usuario')"
    />
    <a [routerLink]="null" (click)="$event.stopPropagation()" class="text-sm font-semibold truncate hover:underline">
      {{ recipeData?.usuario || 'Usuario' }}
    </a>
  </div>

    <div class="flex-grow"></div>

    <div class="flex flex-row justify-between items-end flex-shrink-0">
      <p class="text-base truncate pr-2">{{ recipeData?.nombre || 'Nombre Receta' }}</p>
      <div class="flex items-center flex-shrink-0 text-xs bg-black/40 px-1.5 py-0.5 rounded">
        <svg class="w-3 h-3 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ recipeData.duracion | duracionSinSegundos }}h
      </div>
    </div>
  </div>

  <div class="absolute top-2 right-2 z-10 flex items-center space-x-2">
    <button
      type="button"
      class="flex items-center p-1 rounded-full bg-black/40 text-white hover:bg-black/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
      >
      <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.5 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
      </svg>
      <span *ngIf="(recipeData?.numGuardados || 0) > 0" class="ml-1 text-xs font-medium">{{ recipeData?.numGuardados}}</span>
    </button>

    <button
      type="button"
      class="flex items-center p-1 rounded-full bg-black/40 text-white hover:bg-black/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
      >
      <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
      </svg>
      <span *ngIf="(recipeData?.numMeGusta || 0) > 0" class="ml-1 text-xs font-medium">{{ recipeData?.numMeGusta }}</span>
    </button>
  </div>

</div>
