<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Crear Receta</h1>
  <form (ngSubmit)="registrarReceta()" class="bg-white p-6 rounded-lg shadow-md space-y-6">
    <!-- Nombre de la receta -->
    <div>
      <h2 class="text-xl font-semibold text-gray-700 mb-2">Nombre de la receta</h2>
      <input
        id="nombre"
        [(ngModel)]="receta.nombre"
        name="nombre"
        required
        placeholder="Introduce el nombre de la receta"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
      />
    </div>

    <!-- Descripción -->
    <div>
      <label for="descripcion" class="block text-lg font-semibold text-gray-700 mb-2">Descripción</label>
      <textarea
        id="descripcion"
        [(ngModel)]="receta.descripcion"
        name="descripcion"
        required
        placeholder="Descripción de la receta..."
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
        rows="4"
      ></textarea>
    </div>

    <!-- Duración -->
    <div>
      <h2 class="text-xl font-semibold text-gray-700 mb-2">Duración</h2>
      <div class="flex items-center gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">Horas:</label>
          <input
            type="number"
            min="0"
            max="23"
            [(ngModel)]="hours"
            name="hours"
            (change)="updateDuration()"
            class="w-20 px-2 py-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600">Minutos:</label>
          <input
            type="number"
            min="0"
            max="59"
            [(ngModel)]="minutes"
            name="minutes"
            (change)="updateDuration()"
            class="w-20 px-2 py-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600">Segundos:</label>
          <input
            type="number"
            min="0"
            max="59"
            [(ngModel)]="seconds"
            name="seconds"
            (change)="updateDuration()"
            class="w-20 px-2 py-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
      </div>
      <p class="text-sm text-gray-500 mt-2">Formato: HH:MM:SS (ej. 01:30:00)</p>
    </div>

    <!-- Multimedia -->
    <div>
      <h2 class="text-xl font-semibold text-gray-700 mb-2">Multimedia</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="imagen" class="block text-sm font-medium text-gray-600">Seleccionar foto</label>
          <input
            id="imagen"
            type="file"
            accept="image/*"
            (change)="onFileSelected($event, 'imagen')"
            class="w-full px-2 py-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
        <div>
          <label for="video" class="block text-sm font-medium text-gray-600">Seleccionar video</label>
          <input
            id="video"
            type="file"
            accept="video/*"
            (change)="onFileSelected($event, 'video')"
            class="w-full px-2 py-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
          />
        </div>
      </div>
    </div>

    <!-- Visibilidad -->
    <div>
      <label class="flex items-center space-x-2">
        <input
          type="checkbox"
          [(ngModel)]="receta.esVisible"
          name="esVisible"
          class="w-5 h-5 text-green-500 border-gray-300 rounded focus:ring-green-500"
        />
        <span class="text-gray-700">Hacer receta visible</span>
      </label>
    </div>

    <!-- Botón de enviar -->
    <button
      type="submit"
      class="w-full bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500"
    >
      Registrar Receta
    </button>
  </form>
</div>
