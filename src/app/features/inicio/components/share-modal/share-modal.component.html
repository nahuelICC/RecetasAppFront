<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm" (click)="cerrarModal()">
  <div class="bg-[var(--color-verde-fondo)] rounded-2xl w-full max-w-md max-h-screen overflow-y-auto shadow-2xl flex flex-col" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="border-b border-[var(--color-verde-detalles)] p-4 flex justify-between items-center sticky top-0 bg-[var(--color-verde-fondo)] z-10">
      <h2 class="text-xl font-semibold text-[var(--color-texto-blanco)]">Compartir receta</h2>
      <button (click)="cerrarModal()" class="text-[var(--color-texto-blanco)]">
        <ion-icon name="close-circle-outline" class="text-2xl"></ion-icon>
      </button>
    </div>

    <!-- Buscador -->
    <div class="p-4 border-b border-[var(--color-verde-detalles)]">
      <div class="relative">
        <input
          type="text"
          [(ngModel)]="terminoBusqueda"
          (input)="filtrarUsuarios()"
          placeholder="Buscar..."
          class="w-full bg-[var(--color-verde-cuadros)] text-[var(--color-texto-blanco)] rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[var(--color-amarillo-boton)]"
        >
        <ion-icon name="search" class="absolute right-3 top-3 text-[var(--color-texto-blanco)]"></ion-icon>
      </div>
    </div>

    <!-- Lista de usuarios -->
    <div class="flex-1 overflow-y-auto">
      <div *ngIf="loading" class="p-4 text-center text-[var(--color-texto-blanco)]">
        Cargando contactos...
      </div>

      <div *ngIf="!loading && usuariosFiltrados.length === 0" class="p-4 text-center text-[var(--color-texto-blanco)]">
        No se encontraron contactos
      </div>

      <div *ngIf="error" class="p-4 text-center text-[var(--color-rojo-resaltar)]">
        {{ error }}
      </div>

      <div *ngFor="let usuario of usuariosFiltrados"
           class="flex items-center p-3 hover:bg-[var(--color-verde-translucido)] cursor-pointer transition rounded-xl m-2 shadow-md"
           (click)="toggleSeleccionUsuario(usuario.idUsuario)">
        <div class="relative">
          <img [src]="usuario.fotoPerfil || 'assets/frutero.png'"
               alt="{{ usuario.nombre }}"
               class="w-12 h-12 rounded-full object-cover border-2 border-[var(--color-verde-boton)]">
          <div *ngIf="estaSeleccionado(usuario.idUsuario)"
               class="absolute -bottom-1 -right-1 bg-[var(--color-amarillo-boton)] rounded-full p-1">
            <ion-icon name="checkmark-sharp" class="text-xs text-[var(--color-texto-blanco)]"></ion-icon>
          </div>
        </div>
        <div class="ml-3 flex-1">
          <h3 class="font-medium text-[var(--color-texto-blanco)]">{{ usuario.nombre || usuario.username }}</h3>
          <p class="text-sm text-[var(--color-texto-blanco)] opacity-70">{{ usuario.username }}</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-4 border-t border-[var(--color-verde-detalles)] flex justify-between items-center sticky bottom-0 bg-[var(--color-verde-fondo)] z-10">
      <div *ngIf="usuariosSeleccionados.size > 0" class="text-sm text-[var(--color-texto-blanco)]">
        {{ usuariosSeleccionados.size }} seleccionados
      </div>
      <button
        (click)="enviarReceta()"
        [disabled]="usuariosSeleccionados.size === 0"
        class="bg-[var(--color-amarillo-boton)] text-[var(--color-texto-blanco)] px-4 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Enviar
      </button>
    </div>
  </div>
</div>
