<div class="bg-[var(--color-verde-cuadros)] rounded-lg overflow-hidden shadow-md group min-h-72">
  <!-- Imagen principal -->
  <div class="relative">
    <img [src]="receta.imagen" alt="{{ receta.titulo }}"
         class="w-full h-48 object-cover transition-transform duration-300 group-hover:scale-105">

    <!-- Badge de categoría -->
    <div class="absolute top-2 left-2 bg-green-600 text-white text-xs px-2 py-1 rounded-full flex items-center space-x-1">
      <ion-icon name="person" class="text-white text-base"></ion-icon>
      <span>{{ receta.nombreCooker }}</span>
    </div>

    <!-- Overlay con acciones -->
    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-50 flex items-center justify-center space-x-6 opacity-0 group-hover:opacity-100 transition-all duration-300 z-10">
            <button (click)="toggleLike()">
              <ion-icon [name]="recetaLeGusta ? 'heart' : 'heart-outline'"
                        class="text-4xl"
                        [ngClass]="recetaLeGusta ? 'text-red-500' : 'text-white'">
              </ion-icon>
            </button>
            <button (click)="toggleGuardar()">
              <ion-icon [name]="recetaGuardada ? 'bookmark-sharp' : 'bookmark-outline'"
                        class="text-white text-4xl"
                        [class.text-yellow-500]="recetaGuardada"></ion-icon>
            </button>
          </div>
  </div>

  <!-- Información -->
  <div class="p-2">
    <h3 class="font-bold text-lg mb-1">{{ receta.titulo }}</h3>
  </div>
</div>
