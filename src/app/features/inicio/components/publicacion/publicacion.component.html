
<div class="rounded-lg overflow-hidden relative aspect-square group bg-[var(--color-verde-cuadros)] shadow-md" [routerLink]="'/receta/' + receta.id">

  <!-- Badge del usuario creador -->
  <div class="absolute top-2 left-2 color-verde-claro text-black text-xs px-2 py-1 rounded-full flex items-center space-x-1 z-20 cursor-pointer" (click)="$event.stopPropagation(); redireccionarPerfil(receta.cookerId.toString())">
    <ion-icon name="person" class="text-black text-base"></ion-icon>
    <span>{{ receta.nombreCooker }}</span>
  </div>

  <!-- Imagen con hover -->
  <div class="relative h-full">
    <img [src]="receta.imagen" alt="{{ receta.titulo }}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
  </div>

  <!-- Overlay de acciones centradas -->
  <div class="absolute inset-0 flex items-center justify-center gap-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10">
    <button (click)="$event.stopPropagation(); toggleLike()" class="flex flex-col items-center">
      <ion-icon
        [name]="recetaLeGusta ? 'heart' : 'heart-outline'"
        [ngClass]="recetaLeGusta ? 'text-red-500' : 'text-white'"
        class="text-3xl cursor-pointer hover:scale-110 transition-transform">
      </ion-icon>
    </button>
    <button (click)="$event.stopPropagation(); toggleGuardar()" class="flex flex-col items-center">
      <ion-icon
        [name]="recetaGuardada ? 'bookmark-sharp' : 'bookmark-outline'"
        [ngClass]="recetaGuardada ? 'text-yellow-400' : 'text-white'"
        class="text-3xl cursor-pointer hover:scale-110 transition-transform">
      </ion-icon>
    </button>
    <button (click)="$event.stopPropagation(); agregarIngredientes()" class="flex flex-col items-center">
      <ion-icon
        name="ellipsis-horizontal-outline"
        class="text-3xl text-white cursor-pointer hover:scale-110 transition-transform">
      </ion-icon>
    </button>
  </div>

  <!-- Pie con título truncado -->
  <div class="absolute bottom-0 w-full color-verde-claro-tranlucido p-2 backdrop-blur-sm">
    <p class="font-semibold color-texto truncate text-center text-sm">{{ receta.titulo }}</p>
  </div>

</div>
