<div class="container mx-auto px-32 py-8">
  <!-- Barra de navegación -->
  <div class="flex justify-center gap-6">
    <div>
      <button (click)="mostrarParaTi()" class="text-2xl font-bold mb-4 text-white" [class.text-blue-500]="vista === 'paraTi'">Para ti</button>
    </div>
    <div>
      <button (click)="mostrarSiguiendo()" class="text-2xl font-bold mb-4 text-white" [class.text-blue-500]="vista === 'siguiendo'">Siguiendo</button>
    </div>
  </div>

  <!-- Contenido dinámico -->
  <div class="grid grid-cols-1 gap-4 pt-7">
    <ng-container *ngIf="vista === 'paraTi'">
      <app-publicacion *ngFor="let receta of recetas" [receta]="receta"></app-publicacion>
    </ng-container>
<!--    <app-siguiendo *ngIf="vista === 'siguiendo'"></app-siguiendo>-->
  </div>

</div>
