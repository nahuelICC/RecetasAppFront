<div class="space-y-6" *ngIf="config">
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4 p-1 rounded-lg">
    <h1 class="text-2xl sm:text-3xl font-bold color-texto-blanco">{{ config.entityNamePlural }} {{ showingActivos ? '' : '(Eliminados)' }}</h1>
    <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
      <div class="relative w-full sm:w-64">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearch()"
          [placeholder]="'Buscar ' + config.entityName.toLowerCase() + '...'"
          class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-full focus:ring-2 focus:ring-[#abd1c6] focus:border-[#abd1c6] focus:outline-none shadow-sm transition duration-150 ease-in-out sm:text-sm" />
      </div>

      <button
        (click)="toggleActivosEliminados()"
        type="button"
        class="w-full sm:w-auto px-4 py-2 rounded-full font-semibold transition-colors duration-200 shadow-sm flex items-center justify-center text-sm"
        [ngClass]="showingActivos ? 'color-texto color-gris' : 'color-texto color-verde-claro'">
        <ng-container *ngIf="showingActivos; else showActivosBlock">
          <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125V6.375c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v.001c0 .621.504 1.125 1.125 1.125z"></path>
          </svg>
          Ver Eliminados
        </ng-container>
        <ng-template #showActivosBlock>
          <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          Ver Activos
        </ng-template>
      </button>
      <button *ngIf="config.create" (click)="openAddModal()" type="button" class="w-full sm:w-auto px-4 py-2 rounded-full font-semibold color-boton-amarillo color-texto transition-colors duration-200 shadow-sm flex items-center justify-center text-sm">
        <svg class="-ml-1 mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        Añadir {{ config.entityName }}
      </button>
    </div>
  </div>

  <app-generic-table
    [columns]="config.tableColumns"
    [data]="displayedData"
    [actionsConfig]="showingActivos ? (config.tableActions || { edit: true, delete: true }) : { restore: true }"
    [isLoading]="isLoading"
    (editClicked)="handleEdit($event)"
    (deleteClicked)="handleDelete($event)"
    (viewClicked)="handleView($event)"
    (restoreClicked)="handleRestore($event)">
  </app-generic-table>

  <app-pagination
    *ngIf="!isLoading && totalPages > 0"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChanged)="onPageChanged($event)">
  </app-pagination>
  <app-modal-form
    *ngIf="isModalOpen"
    [title]="modalTitle"
    [initialData]="modalData"
    [formConfig]="config.formConfig"
    (formSubmitted)="onFormSubmit($event)"
    (modalClosed)="onModalClose()">
  </app-modal-form>
  <app-alert-info
    [isVisible]="alertVisible"
    [message]="mensajeAlert"
    [type]="tipoAlert">
  </app-alert-info>
  <app-alert-confirmar
    *ngIf="showAlertConfirmar"
    [message]="mensajeAlert"
    (confirm)="onConfirm()"
    (cancel)="onCalcel()"
    [confirmLabel]="'Aceptar'"
    [showCancelButton]="true"
    [showIcon]="false">
  </app-alert-confirmar>
</div>
<div *ngIf="!config" class="text-center text-gray-500 p-10">Cargando configuración de entidad...</div>
