<div class="space-y-6" *ngIf="config"> <header class="flex flex-col sm:flex-row justify-between items-center gap-4 p-1 rounded-lg">
  <h1 class="text-2xl sm:text-3xl font-bold text-[#004643]">{{ config.entityNamePlural }}</h1>
  <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
    <div class="relative w-full sm:w-64">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearch()"
        [placeholder]="'Buscar ' + config.entityName.toLowerCase() + '...'"
        class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-full ..."
      />
    </div>
    <button (click)="openAddModal()" type="button" class="w-full sm:w-auto ...">
      Añadir {{ config.entityName }}
    </button>
  </div>
</header>

  <app-generic-table
    [columns]="config.tableColumns"
    [data]="displayedData"
    [actionsConfig]="config.tableActions || { edit: true, delete: true }"
    [isLoading]="isLoading"
    (editClicked)="handleEdit($event)"
    (deleteClicked)="handleDelete($event)"
    (viewClicked)="handleView($event)">
  </app-generic-table>

  <app-pagination
    *ngIf="!isLoading && totalPages > 0"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChanged)="onPageChanged($event)">
  </app-pagination>
  <app-modal-form
    *ngIf="isModalOpen"
    [title]="modalTitle"
    [initialData]="modalData"
    [formConfig]="config.formConfig"
    (formSubmitted)="onFormSubmit($event)"
    (modalClosed)="onModalClose()">
  </app-modal-form>
</div>
<div *ngIf="!config" class="text-center text-gray-500 p-10">Cargando configuración de entidad...</div>
