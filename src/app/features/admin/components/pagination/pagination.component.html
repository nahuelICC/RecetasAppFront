<div *ngIf="totalPages > 1" class="flex justify-end items-center mt-6 space-x-3">
  <button type="button" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1"
          class="p-1.5 rounded-md text-gray-500 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-1 focus-visible:ring-[#004643] transition-colors"
          aria-label="Página anterior">
    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
  </button>
  <span class="text-sm font-medium text-gray-700 select-none">
        Página {{ currentPage }} de {{ totalPages }}
      </span>
  <button type="button" (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages"
          class="p-1.5 rounded-md text-gray-500 hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-1 focus-visible:ring-[#004643] transition-colors"
          aria-label="Página siguiente">
    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
  </button>
</div>
