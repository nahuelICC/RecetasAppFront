<app-alert-confirmar *ngIf="borrarRespuesta" [message]="'¿Estás seguro de que quieres borrar tu comentario?'"
 (confirm)="eliminarRespuesta()" (cancel)="borrarRespuesta = false">
</app-alert-confirmar> 
<!-- Contenedor principal del comentario -->
<div
  class="color-fondo-comentarios rounded-2xl shadow-lg hover:shadow-xl transition-all duration-500 mt-6 mb-6 w-full overflow-hidden group">
  <!-- Parte Superior -->
  <div class="color-fondo-comentarios p-4 md:p-6">
    <div class="flex items-start space-x-4">
      <!-- Avatar del usuario -->
      <div class="relative flex-shrink-0">
        <div class="relative">
          <img [src]="respuesta.fotoPerfil==null || ''?  'https://ionicframework.com/docs/img/demos/avatar.svg': respuesta.fotoPerfil" alt="Foto de perfil"
            class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-full object-cover shadow-lg ring-2 ring-gray-100">
        </div>
      </div>

      <!-- Información del usuario y acciones -->
      <div class="flex-1 min-w-0">
        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between w-full">
          <div class="flex-1 min-w-0">
            <h3 class="text-lg sm:text-xl font-bold color-texto-comentarios truncate mb-1">{{ respuesta.username }}
            </h3>
            <div class="flex items-center text-sm color-texto-comentarios">
              <div class="flex items-center color-fondo-comentarios rounded-full px-3 py-1">
                <svg class="w-4 h-4 mr-2 color-texto-comentarios" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="font-medium">{{ respuesta.fecha | timeAgo }}</span>
              </div>
            </div>
          </div>

          <!-- Menú de acciones mejorado -->
          <div class="flex items-center space-x-2 mt-3 sm:mt-0">
            <!-- Botón de denuncia -->
            <button class="relative group/btn p-2 rounded-full hover:bg-red-50 transition-all duration-200">
              <svg xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-gray-400 group-hover/btn:text-red-500 transition-colors duration-200" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <div
                class="absolute left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded-md opacity-0 group-hover/btn:opacity-100 transition-opacity duration-200 whitespace-nowrap z-10">
                Denunciar
              </div>
            </button>

            <!-- Botón de eliminar (solo para el autor) -->
            <button *ngIf="obtenerNombreUsuario() !== null && obtenerNombreUsuario() === respuesta.username"
              (click)="borrarRespuesta = true"
              class="relative group/btn p-2 rounded-full hover:bg-red-50 transition-all duration-200">
              <svg xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-gray-400 group-hover/btn:text-red-500 transition-colors duration-200" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              <div
                class="absolute left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded-md opacity-0 group-hover/btn:opacity-100 transition-opacity duration-200 whitespace-nowrap z-10">
                Eliminar
              </div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Parte Medio -->
  <div class="px-4 py-6 md:px-6">
    <p class="text-base sm:text-lg color-texto-comentarios leading-relaxed break-words font-medium">{{respuesta.texto}}
    </p>
  </div>


</div>
