<!-- Contenedor principal -->
<main class="w-3/4 m-auto p-4">
    <!-- Info plato -->
    <app-info-plato [receta]="receta"></app-info-plato>
  
    <!-- Alérgenos -->
    <section class="space-y-4" *ngIf="receta.alergenos.length > 0">
      <h2 class="text-2xl font-bold text-white uppercase tracking-wider">Alérgenos</h2>
      <div class="flex flex-wrap gap-3">
        <div *ngFor="let alergeno of receta.alergenos">
          <app-alergeno [alergeno]="alergeno"></app-alergeno>
        </div>
      </div>
    </section>
  
    <!-- Ingredientes -->
    <h2 class="text-2xl font-bold text-white uppercase tracking-wider">Ingredientes</h2>
    <div class="flex flex-wrap">
        <div *ngFor="let columna of columnasIngredientes" class="w-full md:w-1/2 lg:w-1/3 px-4">
            <ul>
                <li *ngFor="let ingrediente of columna" class="text-white capitalize m-4">
                    &#183; {{ingrediente.cantidad}} {{ingrediente.medida}} de {{ingrediente.nombre}}
                </li>
            </ul>
        </div>
    </div>
    <div class="p-6 mb-8">
        <h2 class="text-2xl font-bold text-white mb-8 tracking-wider uppercase">
            Preparación
        </h2>
        
        <!-- Contenedor de línea temporal -->
        <div class="relative pl-14">  <!-- Padding ajustado para centrado perfecto -->
            <div class="absolute  top-0 bottom-0 w-0.5 bg-gray-600 z-0"></div> 
            
            <div class="space-y-10">
                <div *ngFor="let paso of pasosReceta" class="relative group"> <!-- Añadido group para hover -->
                    <!-- Número del paso con hover amarillo -->
                    <div class="absolute left-0 w-10 h-10 flex items-center justify-center rounded-full bg-[#CAC4D0] text-gray-900 font-bold transform -translate-x-1/2 z-10
                                transition-colors duration-200 group-hover:bg-amber-400 group-hover:text-gray-900">
                        {{paso.numero}}
                    </div>
                    
                    <!-- Contenido del paso -->
                    <div class="pl-8 pt-2">
                        <div class="p-5 rounded-lg border border-gray-700 bg-gray-800/50 transition-all duration-200 group-hover:border-amber-400/50">
                            <h3 class="text-xl font-semibold text-white mb-2">{{paso.titulo}}</h3>
                            <p class="text-gray-300 whitespace-pre-line">{{paso.descripcion}}</p>
                            
                            <div *ngIf="paso.foto" class="mt-4">
                                <img [src]="paso.foto" 
                                     class="w-full max-w-[500px] aspect-video object-cover rounded-lg shadow-md border border-gray-700 group-hover:border-amber-400/30 transition-all duration-300"
                                     alt="Paso {{paso.numero}}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Video -->
    <section *ngIf="receta.video" class="space-y-4">
        <h2 class="text-2xl font-bold text-white uppercase tracking-wider">Video Tutorial</h2>
        <div class="bg-black rounded-xl overflow-hidden h-[500px]">
          <video controls class="w-full h-full object-cover" poster="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NDAiIGhlaWdodD0iMzYwIiB2aWV3Qm94PSIwIDAgNjQwIDM2MCI+PHJlY3Qgd2lkdGg9IjY0MCIgaGVpZ2h0PSIzNjAiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSIzMjAiIHk9IjE4MCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjI0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSI+VmlkZW8gZGUgcmVjZXRhPC90ZXh0Pjwvc3ZnPg==">
            <source src="{{receta.video}}" type="video/mp4">
            Tu navegador no soporta videos HTML5.
          </video>
        </div>
      </section>
      
  
    <!-- Comentarios -->
    <section class="space-y-6">
      <h2 class="text-2xl font-bold text-white uppercase tracking-wider">Comentarios</h2>
      <div class="space-y-6">
        <div *ngFor="let comentario of comentariosReceta">
          <app-comentario [comentario]="comentario"></app-comentario>
        </div>
      </div>
    </section>
  </main>
