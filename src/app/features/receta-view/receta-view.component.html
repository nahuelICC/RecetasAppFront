<!--main--> 
<div class="bg-[#004643] w-3/4 m-auto p-4 max-h-screen">
  <!-- Info plato -->
  <app-info-plato [receta]="receta"></app-info-plato>
  <!--Alergenos -->
  <div>
    <h2 class="text-white uppercase">Alérgenos</h2>
    <div class="flex flex-row flex-wrap gap-2">
        <div *ngFor="let alergeno of receta.alergenos">
            <app-alergeno [alergeno]="alergeno"></app-alergeno>
        </div>
    </div>
</div>
  <!-- Ingredientes -->
  <div class="flex flex-col">
      <h2 class="text-white uppercase">Ingredientes</h2>
      <ul>
          <li *ngFor="let ingrediente of receta.ingredientes" class="text-white uppercase">&#183; {{ingrediente.cantidad}} {{ingrediente.medida}} de {{ingrediente.nombre}}</li>
      </ul>
  </div>
  <!-- Pasos -->
  <div>
      <h2 class="text-white">Instrucciones</h2>
      <ion-accordion-group class=" text-white" multiple="true">
        <ion-accordion *ngFor="let paso of pasosReceta; let i = index" [value]="'paso_' + i">
            <ion-item slot="header" color="dark">
                <ion-label>{{paso.numero}} º Paso : {{paso.titulo}} </ion-label>
            </ion-item>
            <div class="ion-padding text-black" slot="content">{{paso.descripcion}}</div>
        </ion-accordion>
    </ion-accordion-group>
  </div>
  <!-- Comentarios -->
  <div>
      <h2 class="text-white">Comentarios</h2>
      <app-comentario></app-comentario>      
      <app-comentario></app-comentario>      
      <app-comentario></app-comentario>
      <app-comentario></app-comentario>
  </div>
</div>
