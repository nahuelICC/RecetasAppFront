<!-- perfil-usuario.component.html -->
<div class="p-6 color-verde-oscuro text-white min-h-screen mt-12">
  <!-- Perfil del usuario -->
  <div class="flex items-center gap-4 mb-12">
    <div class="w-20 h-20 rounded-full overflow-hidden">
      <img alt="Avatar" [src]="imagenPerfil" class="w-full h-full object-cover" />
    </div>
    <div class="flex-1">
      <div class="flex flex-col sm:flex-row gap-3.5 ion-align-items-center">
      <h2 class="font-semibold text-xl mb-1 ">{{perfil.nombre}} {{perfil.apellidos}}</h2>
        <div class="flex gap-3 mt-0 lg:mt-4 mb-4 lg:mb-0">
        <app-boton
          [color]="'var(--color-verde-boton)'"
          size="small"
          [label]="'Seguir'"
          *ngIf="!esPerfilPropio"></app-boton>
        <app-boton
          [color]="'var(--color-verde-boton)'"
          size="small"
          [label]="'Mensaje'"
          *ngIf="!esPerfilPropio"></app-boton>
        <app-boton
          [color]="'var(--color-amarillo-boton)'"
          size="small"
          [label]="'Bloquear'"
          *ngIf="!esPerfilPropio"></app-boton>
        </div>
      </div>
      <div class="flex gap-3.5">
      <p class="text-sm text-gray-300 mb-2">{{perfil.descripcion}}</p>
      <ion-icon name="pencil-outline" class="text-md" *ngIf="esPerfilPropio"></ion-icon>
      </div>
      <div class="flex gap-4 text-sm">
        <div class="flex items-center gap-1">
          <span class="font-medium">{{ perfil.numeroRecetas }}</span>
          <span class="text-gray-400">Recetas</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="font-medium">{{ perfil.seguidores }}</span>
          <span class="text-gray-400">Seguidores</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="font-medium">{{ perfil.seguidos }}</span>
          <span class="text-gray-400">Seguidos</span>
        </div>
      </div>
    </div>
  </div>

  <div class="flex gap-4 mb-16 w-full lg:w-1/6" *ngIf="esPerfilPropio">
    <app-boton
      [color]="'var(--color-verde-boton)'"
      size="small"
      [label]="'Lista de la compra'"
      class="w-full max-w-xs">
    </app-boton>
    <app-boton
      [color]="'var(--color-amarillo-boton)'"
      size="small"
      [label]="'Cambiar Contraseña'"
      class="w-full max-w-xs">
    </app-boton>
  </div>

  <div class="flex justify-between gap-10 text-2xl mb-6 pb-4 w-3/4 sm:w-1/2 justify-self-center">
    <ion-icon name="grid-outline" class="cursor-pointer color-hover transition-colors" (click)="activeTab = 'recetas'"></ion-icon>
    <ion-icon name="albums-outline" class="cursor-pointer color-hover transition-colors" (click)="activeTab = 'colecciones'"></ion-icon>
    <ion-icon name="bookmark-outline" class="cursor-pointer color-hover transition-colors" (click)="activeTab = 'guardadas'" *ngIf="esPerfilPropio"></ion-icon>
  </div>

  <div *ngIf="activeTab === 'recetas'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let receta of recetas">
      <app-cuadro-receta [receta]="receta" [esPerfilPropio]="esPerfilPropio"></app-cuadro-receta>
    </div>
  </div>

  <!-- Colecciones -->
  <div *ngIf="activeTab === 'colecciones'" class="space-y-4">
    <div *ngFor="let coleccion of colecciones">
      <div class="bg-gray-200 text-black p-3 rounded cursor-pointer" (click)="coleccion.expandida = !coleccion.expandida">
        <p class="font-semibold">{{ coleccion.titulo }}</p>
      </div>
      <div *ngIf="coleccion.expandida" class="color-verde-claro text-black p-3 rounded mt-1">
        <ul>
          <li *ngFor="let receta of coleccion.recetas.slice(0, coleccion.verMas ? coleccion.recetas.length : 5)">
            <div class="flex justify-between border-b py-1">
              <span>{{ receta.nombre }}</span>
              <span class="text-sm">{{ receta.tiempo }}</span>
            </div>
          </li>
        </ul>
        <button class="mt-2 text-sm text-blue-700" (click)="coleccion.verMas = !coleccion.verMas">
          {{ coleccion.verMas ? 'Ver menos' : 'Ver más' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Recetas Guardadas -->
  <div *ngIf="activeTab === 'guardadas' && esPerfilPropio" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let receta of recetasGuardadas">
      <app-cuadro-receta-guardada [receta]="receta"></app-cuadro-receta-guardada>
    </div>
  </div>
</div>

<app-boton-add-receta></app-boton-add-receta>
