<div class="rounded-lg overflow-hidden relative aspect-square group"
     (click)="redireccionarReceta(receta.idReceta.toString())">

  <div class="absolute top-2 right-2 color-verde-claro p-1.5 rounded-full flex z-20 cursor-pointer" *ngIf="esPerfilPropio" (click)="toggleVisibilidad();$event.stopPropagation()">
    <ion-icon
      [name]="receta.esVisible ? 'eye-outline' : 'eye-off-outline'"
      class="text-xl text-white" >
    </ion-icon>
  </div>

  <div class="relative h-full group">
    <img [src]="receta.fotoReceta" alt="fotoReceta" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />

    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
  </div>

  <div class="absolute inset-0 flex items-center justify-center gap-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10">
    <div class="flex flex-col items-center">
      <ion-icon
        [name]="receta.cookerGusta ? 'heart' : 'heart-outline'"
        [class]="receta.cookerGusta ? 'text-red-500' : 'text-white'"
        class="text-3xl cursor-pointer hover:scale-110 transition-transform"
        (click)="toggleLike(); $event.stopPropagation()"></ion-icon>
      <span class="text-white text-sm mt-1" >{{ receta.meGusta }}</span>
    </div>
    <div class="flex flex-col items-center">
      <ion-icon
        [name]="receta.cookerGuardada ? 'bookmark' : 'bookmark-outline'"
        [class]="receta.cookerGuardada ? 'text-yellow-400' : 'text-white'"
        class="text-3xl cursor-pointer hover:scale-110 transition-transform"
        (click)="toggleGuardar();$event.stopPropagation()"></ion-icon>
      <span class="text-white text-sm mt-1">{{ receta.guardados }}</span>
    </div>
    <div class="flex flex-col items-center">
      <ion-icon
        name="paper-plane-outline"
        class="text-3xl text-white cursor-pointer hover:scale-110 transition-transform"
        (click)="abrirShareModal();$event.stopPropagation()"></ion-icon>
      <span class="invisible text-sm mt-1">_</span>
    </div>

  <div class="absolute bottom-0 w-full color-verde-claro-tranlucido p-3 backdrop-blur-sm">
    <p class="font-semibold color-texto truncate text-center">{{ receta.nombre }}</p>
  </div>

</div>
  @if (mostrarShareModal) {
    <app-share-modal
      [recetaId]="receta.idReceta.toString()"
      (closeModal)="mostrarShareModal = false"
    ></app-share-modal>
  }



</div>
