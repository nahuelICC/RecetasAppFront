<div class="fixed inset-0 z-50">
  <div
    class="fixed inset-0 bg-black/50 transition-opacity duration-300"
    [class]="isOpen ? 'opacity-100 visible' : 'opacity-0 invisible'"
    (click)="onClose()"> <!-- Cambiar aquí -->
  </div>
  <div
    class="bg-[var(--color-verde-cuadros)] fixed right-0 top-0 h-full w-full max-w-md shadow-xl transition-transform duration-300 ease-in-out"
    [class]="isOpen ? 'translate-x-0' : 'translate-x-full'">
    <div class="flex items-center justify-between p-4">
      <h2 class="text-xl font-bold">Lista de la compra</h2>
      <button
        class="p-2 text-black rounded-full transition-colors"
        (click)="onClose()">
        <ion-icon name="close-circle-outline" class="text-2xl"></ion-icon>
      </button>
    </div>
    <div class="h-[calc(100vh-56px)] overflow-y-auto p-4">
      <div *ngIf="!loading && recetas.length > 0">
        <div *ngFor="let receta of recetas" class="mb-6">
          <h3 class="text-lg font-semibold mb-3">
            {{ receta.tituloReceta }}
          </h3>

          <ul class="space-y-1">
            <li
              *ngFor="let ingrediente of receta.ingredientes; let i = index"
              class="flex items-center gap-3 px-2 py-2 rounded-md transition-colors"
              [class.line-through]="ingrediente.checked"
            >
              <input
                type="checkbox"
                [(ngModel)]="ingrediente.checked"
                (ngModelChange)="guardarEstado()"
                class="w-5 h-5 border-gray-300 rounded-full focus:ring-0"
                [style.accentColor]="'var(--color-verde-fondo)'"
              />

              <span
                class="flex-1 text-sm"
                [class.line-through]="ingrediente.checked"
              >
                <span class="font-medium w-16 inline-block">
                  {{ ingrediente.cantidad }}
                </span>
                  {{ ingrediente.nombre }}
              </span>

            </li>

          </ul>
        </div>
      </div>

      <div *ngIf="!loading && recetas.length === 0" class="text-center text-gray-500 py-8">
        No hay ingredientes en tu lista de compra
      </div>
    </div>
  </div>
</div>
